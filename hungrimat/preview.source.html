<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>hungrimat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Asap:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#1B1310;color:#F4F2EE;
  font-family:'Asap',sans-serif;display:grid;place-items:stretch}
.card{position:relative;width:1200px;height:630px;display:grid;
  grid-template-columns:1fr 400px;overflow:hidden}
.content{padding:56px 52px;display:flex;flex-direction:column;justify-content:center;
  position:relative;z-index:2;gap:0}
.eyebrow{font:600 16px 'Asap',sans-serif;text-transform:uppercase;letter-spacing:.24em;color:#C4A47E;margin-bottom:14px}
.wordmark{font:400 76px/1.02 'Alfa Slab One',serif;color:#F4F2EE;letter-spacing:-.01em;}
.claim{font:400 21px/1.45 'Asap',sans-serif;color:#C4A47E;margin-top:16px;max-width:30ch}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#47C049;color:#10240F;
  font:700 17px 'Asap',sans-serif;padding:11px 16px;border-radius:6px;}
.loc{font:500 16px 'Asap',sans-serif;color:#C4A47E}
.panel{position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#2E211A 0 62px,#241A14 62px 66px);border-left:4px solid #78553F;}
.placa{position:absolute;inset:110px 42px;background:linear-gradient(160deg,#3a2a20,#241A14);
  border:2px solid #78553F;border-radius:8px;display:grid;place-items:center;text-align:center;
  box-shadow:inset 0 2px 0 rgba(224,201,168,.18),0 18px 34px rgba(0,0,0,.5)}
.placa p{font:400 40px 'Alfa Slab One',serif;color:#E0C9A8;line-height:1.1;padding:0 18px}
.placa small{display:block;font:600 15px 'Asap',sans-serif;color:#D8410A;letter-spacing:.18em;
  text-transform:uppercase;margin-top:12px}
.rem{position:absolute;width:11px;height:11px;border-radius:50%;background:#C4A47E;opacity:.65}
</style></head><body>
<div class="card">
  <div class="content">
    <p class="eyebrow">Ferretería · Alto Paramaconi, Maturín</p>
    <p class="wordmark">Hungrimat</p>
    <p class="claim">Pinturas, cemento, herramientas y materiales. Aparta tu material y págalo a tu ritmo.</p>
    <div class="foot"><span class="chip">Aparta y paga a tu ritmo</span><span class="loc">Escríbenos por WhatsApp</span></div>
  </div>
  <div class="panel"><div class="placa"><p>Tu obra,<br>al día<small>Materiales · Maturín</small></p></div><i class="rem" style="top:96px;left:56px"></i><i class="rem" style="top:96px;right:56px"></i><i class="rem" style="bottom:96px;left:56px"></i><i class="rem" style="bottom:96px;right:56px"></i></div>
</div>
</body></html>
