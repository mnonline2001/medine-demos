<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>preview El Punto Del Sabor</title>
<style>
@font-face{font-family:"Abril Fatface";src:url(assets/fonts/abril-fatface-latin.woff2) format("woff2")}
@font-face{font-family:"Chivo";font-weight:300 900;src:url(assets/fonts/chivo-latin.woff2) format("woff2")}
@font-face{font-family:"Chivo";font-style:italic;font-weight:300 900;src:url(assets/fonts/chivo-italic-latin.woff2) format("woff2")}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#1B1512;font-family:"Chivo",Arial,sans-serif;color:#F3E9D2}
.card{position:relative;width:1200px;height:630px;background:radial-gradient(1200px 500px at 30% 20%,#2A211C,#1B1512 60%)}
.wall{position:absolute;left:0;right:0;top:0;height:330px;background:linear-gradient(180deg,#F8C92A,#EFBF22)}
.floor{position:absolute;left:0;right:0;top:330px;bottom:0}
.lockup{position:absolute;left:64px;top:44px}
.rest{font-weight:700;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#1B1512}
.punto{font-family:"Abril Fatface",serif;font-size:150px;line-height:.9;color:#F3E9D2;text-shadow:5px 5px 0 #0b0806;white-space:nowrap;display:flex;align-items:flex-end;gap:6px}
.pin{width:92px;height:140px;margin-bottom:4px}
.sabor{font-style:italic;font-weight:800;font-size:54px;color:#C8322B;margin:6px 0 0 8px}
.scene{position:absolute;right:40px;top:250px;width:560px;height:360px;perspective:1100px;perspective-origin:50% 10%}
.mesa{position:absolute;left:50%;top:20px;width:520px;height:330px;transform:translateX(-50%) rotateX(56deg);transform-style:preserve-3d;background:linear-gradient(165deg,#FFD53A,#F8C92A 48%,#E4B41C);border:14px solid #1C1A18;box-shadow:0 40px 50px -20px rgba(0,0,0,.85);display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:26px 30px}
.plato{display:grid;place-items:center}
.plato svg{width:150px}
.banco{position:absolute;bottom:20px;width:120px;height:48px;background:repeating-linear-gradient(180deg,#B6541F 0 12px,#8B421F 12px 15px,#A05227 15px 27px);border:3px solid #4d2412}
.bl{left:8px;transform:skewY(6deg)}.br{right:8px;transform:skewY(-6deg)}
.tag{position:absolute;left:64px;top:362px;display:grid;gap:16px}
.line{font-size:28px;font-weight:700;color:#F3E9D2;max-width:540px;line-height:1.25}
.chip{display:inline-flex;align-items:center;height:58px;padding:0 26px;background:#25D366;color:#052D16;border:4px solid #1B1512;border-radius:6px;box-shadow:inset 0 0 0 3px #25D366,inset 0 0 0 5px #1B1512;font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase;width:max-content}
.bars{position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#1C1A18 0 7px,#F8C92A 7px 36px)}
</style></head><body><div class="card">
<div class="wall"></div><div class="floor"></div>
<div class="lockup">
  <div class="rest">Restaurant</div>
  <div class="punto">EL PUNT<svg class="pin" viewBox="0 0 64 100"><ellipse cx="32" cy="92" rx="24" ry="6" fill="rgba(0,0,0,.45)"/><ellipse cx="32" cy="88" rx="20" ry="6" fill="#8E1F1A"/><path fill="#C8322B" d="M32 2C17 2 6 13.5 6 28c0 19 26 60 26 60s26-41 26-60C58 13.5 47 2 32 2z"/><path fill="#E0453C" d="M32 6c-9 0-16 6-18 14 4-6 10-9 18-9s14 3 18 9C48 12 41 6 32 6z" opacity=".8"/><circle cx="32" cy="28" r="11" fill="#F8C92A"/></svg></div>
  <div class="sabor">del Sabor</div>
</div>
<div class="tag">
  <div class="line">Hamburguesas, perros y pepitos en Maturín.<br>Arma tu pedido y mándalo por WhatsApp,<br>listo para pasarlo a buscar.</div>
  <div class="chip">Pide por WhatsApp →</div>
</div>
<div class="scene">
  <div class="mesa">
    <div class="plato"><svg viewBox="0 0 120 90"><ellipse cx="60" cy="72" rx="56" ry="14" fill="#F3E9D2"/><path d="M22 60c0-6 6-8 12-8h52c6 0 12 2 12 8s-6 8-12 8H34c-6 0-12-2-12-8z" fill="#C8322B"/><path d="M18 52h84c2 0 3 2 2 4-8 4-20 6-44 6S26 60 16 56c-1-2 0-4 2-4z" fill="#1B1512"/><path d="M20 44c0-16 18-24 40-24s40 8 40 24c0 2-2 4-4 4H24c-2 0-4-2-4-4z" fill="#F8C92A"/><g fill="#1B1512"><circle cx="42" cy="32" r="2.2"/><circle cx="58" cy="27" r="2.2"/><circle cx="74" cy="31" r="2.2"/><circle cx="52" cy="37" r="2.2"/><circle cx="68" cy="38" r="2.2"/></g></svg></div>
    <div class="plato"><svg viewBox="0 0 120 90"><ellipse cx="60" cy="72" rx="56" ry="14" fill="#F3E9D2"/><path d="M14 50c0-10 8-16 16-16h60c8 0 16 6 16 16v6c0 8-8 12-16 12H30c-8 0-16-4-16-12z" fill="#F8C92A"/><rect x="22" y="36" width="76" height="16" rx="8" fill="#C8322B"/><path d="M26 44l8-6 8 6 8-6 8 6 8-6 8 6 8-6 8 6" fill="none" stroke="#1B1512" stroke-width="3" stroke-linejoin="round"/></svg></div>
    <div class="plato"><svg viewBox="0 0 120 90"><ellipse cx="60" cy="72" rx="56" ry="14" fill="#F3E9D2"/><path d="M10 52c0-8 10-12 22-12h56c12 0 22 4 22 12s-10 14-22 14H32c-12 0-22-6-22-14z" fill="#F8C92A"/><path d="M14 46h92c-4-10-14-20-46-20S18 36 14 46z" fill="#F8C92A"/><path d="M20 44h80v4H20z" fill="#C8322B"/><path d="M22 48h76v3H22z" fill="#1B1512"/><g stroke="#1B1512" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M40 32l4-6"/><path d="M60 30l4-6"/><path d="M80 32l4-6"/></g></svg></div>
  </div>
  <div class="banco bl"></div><div class="banco br"></div>
</div>
<div class="bars"></div>
</div></body></html>
