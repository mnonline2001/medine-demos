<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;font-family:'Space Grotesk',sans-serif;background:#131519}
  .card{position:relative;width:1200px;height:630px;color:#eeece5;overflow:hidden}
  .bg{position:absolute;inset:0}
  .bg img{width:100%;height:100%;object-fit:cover;filter:grayscale(.4) brightness(.4) contrast(1.05)}
  .bg::after{content:"";position:absolute;inset:0;background:
    radial-gradient(120% 90% at 80% 6%, rgba(201,165,95,.16), transparent 45%),
    linear-gradient(90deg, rgba(19,21,25,.94) 40%, rgba(19,21,25,.7))}
  .pole{position:absolute;top:0;left:0;bottom:0;width:22px;
    background:repeating-linear-gradient(48deg,#c8352f 0 15px,#f1efe8 15px 30px,#2f4f8c 30px 45px,#f1efe8 45px 60px)}
  .in{position:absolute;inset:0;padding:70px 80px 60px 110px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:20px;letter-spacing:.32em;text-transform:uppercase;color:#c9a55f;font-weight:600;margin-bottom:8px}
  .brand{font-family:'Kaushan Script',cursive;font-size:130px;line-height:.9;color:#eeece5;text-shadow:0 0 40px rgba(201,165,95,.25)}
  .brand span{color:#c9a55f}
  .rule{width:120px;height:3px;background:linear-gradient(90deg,#c9a55f,transparent);margin:26px 0}
  .tag{font-size:34px;font-weight:500;color:#d7d5cd;max-width:640px}
  .tag b{color:#fff;font-weight:700}
  .foot{position:absolute;left:110px;bottom:44px;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:#9aa1a8}
  .badge{position:absolute;right:70px;bottom:44px;font-size:16px;color:#8b9198}
</style></head>
<body>
  <div class="card">
    <div class="bg"><img src="./assets/fachada.jpg" alt=""></div>
    <div class="pole"></div>
    <div class="in">
      <div class="eyebrow">Barbería para chicos y grandes · Maturín</div>
      <div class="brand">Wisin <span>Barber</span></div>
      <div class="rule"></div>
      <div class="tag"><b>40 años de tijera.</b> Para chicos y grandes.</div>
    </div>
    <div class="foot">@wisin_barber18</div>
    <div class="badge">medine.tech</div>
  </div>
</body></html>
