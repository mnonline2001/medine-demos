<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Onest:wght@400;600&family=Yellowtail&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{display:flex;font-family:"Onest",sans-serif;color:#F4E8D6;
  background:radial-gradient(120% 100% at 80% 0%,#33200F,transparent 55%),linear-gradient(160deg,#1E140D,#17100B)}
.left{flex:1.12;padding:64px 58px;display:flex;flex-direction:column;justify-content:center;position:relative}
.eyebrow{font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#E6BB6E;font-weight:600;margin-bottom:20px}
h1{font-family:"Syne";font-weight:800;font-size:74px;line-height:1.0;letter-spacing:-.03em}
h1 em{font-family:"Yellowtail",cursive;font-weight:400;font-style:normal;color:#E6BB6E;font-size:1.12em;line-height:1;display:inline-block;padding-right:.1em}
.sub{font-size:21px;color:#CBB79E;margin-top:22px;max-width:22ch}
.brand{display:flex;align-items:center;gap:15px;margin-top:38px}
.brand img{width:74px;height:74px;border-radius:50%;box-shadow:0 10px 24px -10px #000}
.brand b{font-family:"Syne";font-weight:800;font-size:24px}
.brand span{display:block;font-size:14px;letter-spacing:.06em;color:#E6BB6E;font-weight:600}
.right{flex:.88;position:relative;overflow:hidden}
.right .glow{position:absolute;width:520px;height:520px;left:55%;top:44%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(230,187,110,.3),transparent 65%)}
.right .disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:400px;height:400px;border-radius:50%;
  overflow:hidden;border:1px solid rgba(230,187,110,.4);box-shadow:0 30px 70px -20px #000,0 0 60px -8px rgba(230,187,110,.35)}
.right .disc img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:34px;bottom:40px;background:#251910;border:1px solid rgba(230,187,110,.25);border-radius:14px;padding:11px 16px;z-index:3}
.tag b{font-family:"Syne";color:#E6BB6E;font-size:19px;display:block}
.tag span{font-size:12px;color:#CBB79E}
</style></head>
<body>
  <div class="left">
    <div class="eyebrow">Repostería &amp; Panadería · Maturín</div>
    <h1>Tus postres<br><em>favoritos</em>,<br>recién hechos.</h1>
    <div class="sub">Tortas, marquesas, galletas y pan. Delivery a toda Maturín.</div>
    <div class="brand">
      <img src="assets/logo.jpg" alt="">
      <div><b>Adams</b><span>Creamos tus postres favoritos</span></div>
    </div>
  </div>
  <div class="right">
    <div class="glow"></div>
    <div class="disc"><img src="assets/choco.jpg" alt=""></div>
    <div class="tag"><b>Delivery 🛵</b><span>a toda Maturín</span></div>
  </div>
</body></html>
