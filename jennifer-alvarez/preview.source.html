<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>jennifer-alvarez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Karla:wght@400;500;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#fbfdfd;color:#16303a;
  font-family:'Karla',sans-serif;display:grid;place-items:stretch}
.card{position:relative;width:1200px;height:630px;display:grid;
  grid-template-columns:1fr 400px;overflow:hidden}
.content{padding:56px 52px;display:flex;flex-direction:column;justify-content:center;
  position:relative;z-index:2;gap:0}
.eyebrow{font:600 16px 'Karla',sans-serif;text-transform:uppercase;letter-spacing:.24em;color:#4a6570;margin-bottom:14px}
.wordmark{font:600 66px/1.06 'Fraunces',serif;color:#16303a;letter-spacing:-.01em;}
.claim{font:400 21px/1.45 'Karla',sans-serif;color:#4a6570;margin-top:16px;max-width:30ch}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#2aa5a0;color:#ffffff;
  font:700 17px 'Karla',sans-serif;padding:11px 16px;border-radius:999px;}
.loc{font:500 16px 'Karla',sans-serif;color:#4a6570}
.panel{position:relative;overflow:hidden;background:linear-gradient(160deg,#eaf7f6,#f6fbfb);border-left:1px solid #d8ecea;}
.cells{position:absolute;inset:0 44px;display:grid;grid-template-columns:1fr 1fr;
  grid-auto-rows:118px;gap:16px;align-content:center}
.cells i{background:#fff;border:1px solid #dcedeb;border-radius:22px;display:grid;place-items:center;
  font:700 20px 'Karla',sans-serif;font-style:normal;color:#1b7a76;text-align:center;padding:10px;
  box-shadow:0 8px 20px rgba(22,48,58,.06)}
.cells i:nth-child(4){background:#2aa5a0;color:#fff;border-color:#2aa5a0}
</style></head><body>
<div class="card">
  <div class="content">
    <p class="eyebrow">Odontología general y cirugía dental</p>
    <p class="wordmark">Od. Jennifer<br>Álvarez</p>
    <p class="claim">Atención solo con cita previa. Aparte su cita por WhatsApp.</p>
    <div class="foot"><span class="chip">Aparta tu cita</span><span class="loc">Maturín, Monagas</span></div>
  </div>
  <div class="panel"><div class="cells"><i>Limpieza</i><i>Restauración</i><i>Cirugía</i><i>Cita previa</i></div></div>
</div>
</body></html>
