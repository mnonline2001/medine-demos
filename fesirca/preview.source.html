<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>fesirca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Staatliches&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#0E0E10;color:#F9F9F9;
  font-family:'Barlow',sans-serif;display:grid;place-items:stretch}
.card{position:relative;width:1200px;height:630px;display:grid;
  grid-template-columns:1fr 430px;overflow:hidden}
.content{padding:56px 52px;display:flex;flex-direction:column;justify-content:center;
  position:relative;z-index:2;gap:0}
.eyebrow{font:600 16px 'Barlow',sans-serif;text-transform:uppercase;letter-spacing:.24em;color:#888888;margin-bottom:14px}
.wordmark{font:400 96px/.92 'Staatliches',sans-serif;color:#F9F9F9;letter-spacing:.02em;text-transform:uppercase;}
.claim{font:400 21px/1.45 'Barlow',sans-serif;color:#888888;margin-top:16px;max-width:30ch}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#D13438;color:#F9F9F9;
  font:700 17px 'Barlow',sans-serif;padding:11px 16px;border-radius:4px;}
.loc{font:500 16px 'Barlow',sans-serif;color:#888888}
.panel{position:relative;overflow:hidden;background:repeating-linear-gradient(180deg,#1a1a1f 0 88px,#0E0E10 88px 92px);border-left:3px solid #232329;}
.ticket{position:absolute;inset:64px 46px;background:#E8E1D1;color:#141417;
  padding:26px 22px;font:600 15px 'Barlow',sans-serif;line-height:1.9;
  -webkit-mask:radial-gradient(circle 7px at 0 0,#0000 98%,#000) 0 0/16px 100%,
    radial-gradient(circle 7px at 100% 0,#0000 98%,#000) 0 0/16px 100%;
  box-shadow:0 20px 40px rgba(0,0,0,.5)}
.ticket b{display:block;font:400 26px 'Staatliches',sans-serif;letter-spacing:.06em;
  border-bottom:2px dashed #C3BBA6;padding-bottom:10px;margin-bottom:10px}
.ticket span{display:flex;justify-content:space-between}
</style></head><body>
<div class="card">
  <div class="content">
    <p class="eyebrow">Ferretería · Mercado Viejo, Maturín</p>
    <p class="wordmark">Ferretería<br>Siria</p>
    <p class="claim">Todo lo de tu obra en un solo mostrador. Desde 1994 contigo.</p>
    <div class="foot"><span class="chip">★ 4.2 en Google</span><span class="loc">FESIRCA</span></div>
  </div>
  <div class="panel"><div class="ticket"><b>Lista de obra</b><span>Plomería<i>✓</i></span><span>Herrería<i>✓</i></span><span>Electricidad<i>✓</i></span><span>Pinturas<i>✓</i></span><span>Maquinaria<i>✓</i></span></div></div>
</div>
</body></html>
