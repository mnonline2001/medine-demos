<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>acero-al-mayor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#141414;color:#EBECEE;
  font-family:'Sora',sans-serif;display:grid;place-items:stretch}
.card{position:relative;width:1200px;height:630px;display:grid;
  grid-template-columns:1fr 430px;overflow:hidden}
.content{padding:56px 52px;display:flex;flex-direction:column;justify-content:center;
  position:relative;z-index:2;gap:0}
.eyebrow{font:600 16px 'Sora',sans-serif;text-transform:uppercase;letter-spacing:.24em;color:#93949A;margin-bottom:14px}
.wordmark{font:400 82px/.95 'Anton',sans-serif;color:#EBECEE;letter-spacing:.005em;text-transform:uppercase;}
.claim{font:400 21px/1.45 'Sora',sans-serif;color:#93949A;margin-top:16px;max-width:30ch}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#F17106;color:#141414;
  font:700 17px 'Sora',sans-serif;padding:11px 16px;border-radius:3px;}
.loc{font:500 16px 'Sora',sans-serif;color:#93949A}
.panel{position:relative;overflow:hidden;background:linear-gradient(150deg,#232122,#1b1b1d 55%,#141414);border-left:4px solid #F17106;}
.manif{position:absolute;inset:56px 40px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.manif div{display:flex;justify-content:space-between;align-items:center;
  background:#1b1b1d;border:1px solid #33312f;border-left:4px solid #F17106;padding:15px 16px;
  font:600 16px 'Sora',sans-serif;color:#EBECEE}
.manif span:last-child{color:#12B03A;font-weight:700}
.manif h4{font:400 22px 'Anton',sans-serif;letter-spacing:.1em;color:#93949A;text-transform:uppercase}
</style></head><body>
<div class="card">
  <div class="content">
    <p class="eyebrow">Acero y hierro al mayor · Maturín</p>
    <p class="wordmark">Acero<br>al Mayor</p>
    <p class="claim">Por atado, por caja y por pieza, con mínimos de compra. Cabilla, alambrón, perfiles y láminas.</p>
    <div class="foot"><span class="chip">★ 4.5 en Google</span><span class="loc">Av. Bella Vista, Monagas</span></div>
  </div>
  <div class="panel"><div class="manif"><h4>Manifiesto de carga</h4><div><span>Cabilla</span><span>por atado</span></div><div><span>Alambrón</span><span>por rollo</span></div><div><span>Perfiles</span><span>por pieza</span></div><div><span>Láminas</span><span>por caja</span></div><div><span>Cerchas</span><span>por unidad</span></div></div></div>
</div>
</body></html>
