<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>ramos-y-rosas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;font-family:'Jost',sans-serif;color:#743652}
.card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 470px;overflow:hidden;
  background:radial-gradient(120% 140% at 0% 0%, #FFFFFF 0%, #FDFDEE 45%, #FBDBEA 100%)}
.content{padding:60px 34px 60px 68px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.eyebrow{font:600 15px 'Jost';text-transform:uppercase;letter-spacing:.28em;color:#B0447E;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.eyebrow::before{content:"";width:30px;height:2px;background:#997C51;border-radius:2px}
.wordmark{font:italic 600 92px/.92 'Cormorant Garamond',serif;color:#8E2E63;letter-spacing:-.01em}
.wordmark b{display:block;font:italic 500 40px/1 'Cormorant Garamond',serif;color:#743652;letter-spacing:.02em}
.rose{display:inline-block;color:#F756A3}
.claim{font:500 24px/1.45 'Jost';color:#5c4152;margin-top:20px;max-width:24ch}
.foot{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:30px}
.chip{display:inline-flex;align-items:center;gap:9px;background:#F0459A;color:#fff;font:600 18px 'Jost';padding:14px 24px;border-radius:999px;box-shadow:0 10px 24px rgba(240,69,154,.32)}
.ig{font:500 18px 'Jost';color:#743652;background:#fff;border:1.5px solid #F5C8DF;padding:12px 20px;border-radius:999px}
.ig b{color:#C23B84}
.seal{position:absolute;left:68px;bottom:26px;font:500 14px 'Jost';color:#997C51;letter-spacing:.03em}
.panel{position:relative;overflow:hidden;border-left:1px solid #EBD3C0}
.panel img{width:100%;height:100%;object-fit:cover;display:block}
.tagpan{position:absolute;left:26px;bottom:28px;background:rgba(255,255,255,.94);color:#8E2E63;font:600 17px 'Jost';padding:11px 16px;border-radius:12px;box-shadow:0 10px 24px rgba(116,54,82,.28)}
</style></head><body>
<div class="card">
  <div class="content">
    <p class="eyebrow">Tortas &amp; flores · Maturín</p>
    <p class="wordmark">Ramos <span class="rose">&amp;</span> Rosas<b>Pasteles</b></p>
    <p class="claim">Tortas que se regalan — con flores de verdad.</p>
    <div class="foot"><span class="chip">Encargar por WhatsApp</span><span class="ig"><b>@</b>pastelesramosyrosas</span></div>
    <p class="seal">Propuesta de diseño · Medine.tech</p>
  </div>
  <div class="panel">
    <img src="assets/ryr-combo-flores.jpg" alt="Torta de bodas con rosas — Ramos y Rosas">
    <span class="tagpan">🌹 Hecho en Maturín</span>
  </div>
</div>
</body></html>
