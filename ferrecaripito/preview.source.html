<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>ferrecaripito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#FDFBF6;color:#091A3C;
  font-family:'Nunito Sans',sans-serif;display:grid;place-items:stretch}
.card{position:relative;width:1200px;height:630px;display:grid;
  grid-template-columns:1fr 420px;overflow:hidden}
.content{padding:56px 52px;display:flex;flex-direction:column;justify-content:center;
  position:relative;z-index:2;gap:0}
.eyebrow{font:600 16px 'Nunito Sans',sans-serif;text-transform:uppercase;letter-spacing:.24em;color:#41526f;margin-bottom:14px}
.wordmark{font:400 88px/.96 'Lilita One',sans-serif;color:#091A3C;letter-spacing:.005em;}
.claim{font:400 21px/1.45 'Nunito Sans',sans-serif;color:#41526f;margin-top:16px;max-width:30ch}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#F59C0B;color:#091A3C;
  font:700 17px 'Nunito Sans',sans-serif;padding:11px 16px;border-radius:8px;}
.loc{font:500 16px 'Nunito Sans',sans-serif;color:#41526f}
.panel{position:relative;overflow:hidden;background:#FFFDF8;border-left:2px solid #e6e0d2;background-image:linear-gradient(#dfe6f2 1px,transparent 1px),linear-gradient(90deg,#dfe6f2 1px,transparent 1px);background-size:26px 26px;}
.plano{position:absolute;inset:58px 44px;border:2.5px solid #091A3C;border-radius:6px;
  background:rgba(255,253,248,.92);padding:24px;font:700 17px 'Nunito Sans',sans-serif;color:#091A3C}
.plano u{display:block;text-decoration:none;border-bottom:2px dashed #0277FA;padding:9px 0;color:#0A57C2}
.plano em{display:block;font:400 26px 'Lilita One',sans-serif;font-style:normal;margin-bottom:12px}
.mk{position:absolute;left:44px;right:44px;bottom:40px;height:12px;background:#F59C0B;opacity:.55;
  border-radius:3px;transform:rotate(-1.2deg)}
</style></head><body>
<div class="card">
  <div class="content">
    <p class="eyebrow">Ferretería · 2 sedes en Maturín</p>
    <p class="wordmark">Ferrecaripito</p>
    <p class="claim">La lista de tu obra, resuelta hoy. Cashea en las dos sedes y delivery en toda Maturín.</p>
    <div class="foot"><span class="chip">★ 4.6 en Google</span><span class="loc">Los Guaritos · Tipuro</span></div>
  </div>
  <div class="panel"><div class="plano"><em>Cotiza tu lista</em><u>Cemento · 20 sacos</u><u>Cabilla 3/8 · 40</u><u>Pintura · 5 gal</u><u>Bloques · 300</u></div><div class="mk"></div></div>
</div>
</body></html>
