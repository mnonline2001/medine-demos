<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>dojo-jj-rondon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#17181c;color:#f5f4f0;
  font-family:'Work Sans',sans-serif;display:grid;place-items:stretch}
.card{position:relative;width:1200px;height:630px;display:grid;
  grid-template-columns:1fr 390px;overflow:hidden}
.content{padding:56px 52px;display:flex;flex-direction:column;justify-content:center;
  position:relative;z-index:2;gap:0}
.eyebrow{font:600 16px 'Work Sans',sans-serif;text-transform:uppercase;letter-spacing:.24em;color:#adafb8;margin-bottom:14px}
.wordmark{font:400 94px/.92 'Bebas Neue',sans-serif;color:#f5f4f0;letter-spacing:.02em;}
.claim{font:400 21px/1.45 'Work Sans',sans-serif;color:#adafb8;margin-top:16px;max-width:30ch}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#d63a2f;color:#ffffff;
  font:700 17px 'Work Sans',sans-serif;padding:11px 16px;border-radius:4px;}
.loc{font:500 16px 'Work Sans',sans-serif;color:#adafb8}
.panel{position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,#1d1f26 0 30px,#191b21 30px 60px);border-left:3px solid #23252d;}
.cinta{position:absolute;left:-40px;right:-40px;top:50%;transform:translateY(-50%) rotate(-5deg);
  background:#d63a2f;box-shadow:0 18px 38px rgba(0,0,0,.55);padding:26px 0;text-align:center}
.cinta p{font:400 40px/1 'Bebas Neue',sans-serif;color:#fff;letter-spacing:.2em}
.cinta small{display:block;font:600 13px 'Work Sans',sans-serif;color:#ffd9d6;
  letter-spacing:.3em;text-transform:uppercase;margin-top:9px}
</style></head><body>
<div class="card">
  <div class="content">
    <p class="eyebrow">Escuela de Karate-Do · Maturín</p>
    <p class="wordmark">Dojo J.J.<br>Rondón</p>
    <p class="claim">Karate-Do para niños y adultos. Un dojo que forma medallistas: disciplina y mejora continua.</p>
    <div class="foot"><span class="chip">Pregunta horarios por WhatsApp</span><span class="loc">Maturín, Monagas</span></div>
  </div>
  <div class="panel"><div class="cinta"><p>Disciplina</p><small>Mejora continua</small></div></div>
</div>
</body></html>
